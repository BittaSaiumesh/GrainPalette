{% extends "base.html" %}
{% block content %}
<h2>Prediction Result</h2>
<p><b>Predicted Type:</b> {{ prediction }}</p>
{% if image_path %}
    <img src="{{ url_for('static', filename=image_path.split('static/')[-1]) }}" style="max-width:300px;">
{% endif %}
<p><a href="{{ url_for('index') }}">Try Another Image</a></p>
{% endblock %}
